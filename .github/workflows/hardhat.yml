name: Hardhat CI

on:
  # jalan otomatis saat push / PR ke main
  push:
    branches: [main]
  pull_request:
    branches: [main]

  # jalan manual
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ⬇ bisa tetap npm ci; ganti npm install kalau ci sering gagal
      - name: Install deps
        run: npm install

      - name: Hardhat tests
        run: npx hardhat test

      # —— LANGKAH BARU ——  
      - name: Upload ABI artifact
        uses: actions/upload-artifact@v4
        with:
          name: quantra-abi
          path: artifacts/contracts/QuantraStake.sol/QuantraStake.json
