name: Hardhat CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install

      - name: Compile contracts
        run: npx hardhat compile

      - name: Run tests
        run: npx hardhat test

      - name: Upload ABI artifact
        uses: actions/upload-artifact@v4
        with:
          name: quantra-abi
          path: artifacts/contracts/QuantraStake.sol/QuantraStake.json
