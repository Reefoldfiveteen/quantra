name: Hardhat CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:       # ← tambahkan baris ini

jobs:
  test:
    runs-on: ubuntu-latest
    ...
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx hardhat test
